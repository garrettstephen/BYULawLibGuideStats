name: Publish LibGuide Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "24 10 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch LibGuides stats
        run: node scripts/fetch-libguides-stats.js
        env:
          LIBGUIDES_API_BASE_URL: ${{ secrets.LIBGUIDES_API_BASE_URL }}
          LIBGUIDES_TOKEN_URL: ${{ secrets.LIBGUIDES_TOKEN_URL }}
          LIBGUIDES_SITE_ID: ${{ secrets.LIBGUIDES_SITE_ID }}
          LIBGUIDES_CLIENT_ID: ${{ secrets.LIBGUIDES_CLIENT_ID }}
          LIBGUIDES_CLIENT_SECRET: ${{ secrets.LIBGUIDES_CLIENT_SECRET }}
          LIBGUIDES_API_KEY: ${{ secrets.LIBGUIDES_API_KEY }}
          LIBGUIDES_API_KEY_PARAM: ${{ secrets.LIBGUIDES_API_KEY_PARAM }}
          LIBGUIDES_API_KEY_HEADER: ${{ secrets.LIBGUIDES_API_KEY_HEADER }}
          LIBGUIDES_GUIDE_STATS_ENDPOINT: ${{ secrets.LIBGUIDES_GUIDE_STATS_ENDPOINT }}
          LIBGUIDES_ASSET_STATS_ENDPOINT: ${{ secrets.LIBGUIDES_ASSET_STATS_ENDPOINT }}
          LIBGUIDES_GUIDE_METADATA_ENDPOINT: ${{ secrets.LIBGUIDES_GUIDE_METADATA_ENDPOINT }}
          LIBGUIDES_SITE_PARAM: ${{ secrets.LIBGUIDES_SITE_PARAM }}
          LIBGUIDES_START_PARAM: ${{ secrets.LIBGUIDES_START_PARAM }}
          LIBGUIDES_END_PARAM: ${{ secrets.LIBGUIDES_END_PARAM }}
          LIBGUIDES_MONTH_PARAM: ${{ secrets.LIBGUIDES_MONTH_PARAM }}
          LIBINSIGHT_GA_OVERVIEW_ENDPOINT: ${{ secrets.LIBINSIGHT_GA_OVERVIEW_ENDPOINT }}
          LIBINSIGHT_GA_TRENDS_ENDPOINT: ${{ secrets.LIBINSIGHT_GA_TRENDS_ENDPOINT }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GA4_PROPERTY_RESEARCH_GUIDES: ${{ secrets.GA4_PROPERTY_RESEARCH_GUIDES }}
          GA4_PROPERTY_LIBGUIDES: ${{ secrets.GA4_PROPERTY_LIBGUIDES }}
          GA4_PROPERTY_FCIL: ${{ secrets.GA4_PROPERTY_FCIL }}
          GA4_PROPERTY_HUNTERS_QUERY: ${{ secrets.GA4_PROPERTY_HUNTERS_QUERY }}
          GA4_PROPERTY_DIGITAL_COMMONS: ${{ secrets.GA4_PROPERTY_DIGITAL_COMMONS }}

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/*.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update LibGuide stats data [auto]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
