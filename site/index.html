<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BYU Law Library monthly resource usage — digital display.">
  <title>BYU Law Library — Resource Stats</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="shell">

  <main id="grid">

    <section class="col">
      <div class="col-head">
        <span class="col-label">LibGuides</span>
        <span class="col-sub">Top Research Guides This Month</span>
      </div>
      <div class="col-body" id="list-libguides">
        <div class="loading-row">Loading&hellip;</div>
      </div>
      <div class="col-footer">
        <div class="col-qr" id="col-qr-libguides"></div>
      </div>
    </section>

    <div class="col-divider" aria-hidden="true"></div>

    <section class="col">
      <div class="col-head">
        <span class="col-label">Hunter&#8217;s Query</span>
        <span class="col-sub">Top Posts This Month</span>
      </div>
      <div class="col-body" id="list-hq">
        <div class="loading-row">Loading&hellip;</div>
      </div>
      <div class="col-footer">
        <div class="col-qr" id="col-qr-hq"></div>
      </div>
    </section>

    <div class="col-divider" aria-hidden="true"></div>

    <section class="col">
      <div class="col-head">
        <span class="col-label">Digital Commons</span>
        <span class="col-sub">Top Items This Month</span>
      </div>
      <div class="col-body" id="list-dc">
        <div class="loading-row">Loading&hellip;</div>
      </div>
      <div class="col-footer">
        <div class="col-qr" id="col-qr-dc"></div>
      </div>
    </section>

  </main>

  <footer id="ftr">
    <span id="ftr-label">Howard W. Hunter Law Library &mdash; Brigham Young University</span>
    <span id="ftr-right">
      <span id="ftr-updated"></span>
      <span class="ftr-sep" aria-hidden="true"> &bull; </span>
      <span id="hdr-month"></span>
    </span>
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
